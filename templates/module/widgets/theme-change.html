<th:block th:fragment="theme-change">
  <th:block th:if="${theme.config.theme.theme_change}">
    <button
      class="change-skin-gear theme-change-js no-select"
      type="button"
      aria-label="切换为黑夜模式"
      aria-pressed="false"
    >
      <span class="keys">
        <span class="junto-theme-mode junto-theme-mode-day"><span class="iconify" data-icon="fa:sun-o"></span>DAY</span>
        <span class="junto-theme-mode-track" aria-hidden="true"><i></i></span>
        <span class="junto-theme-mode junto-theme-mode-night"
          ><span class="iconify" data-icon="fa:moon-o"></span>NIGHT</span
        >
      </span>
    </button>
    <button class="mobile-change-skin theme-change-js" type="button" aria-label="切换为黑夜模式" aria-pressed="false">
      <span class="iconify" data-junto-theme-icon data-icon="fa:moon-o" style="top: 0"></span>
    </button>
  </th:block>
</th:block>
