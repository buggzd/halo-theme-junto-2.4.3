<article th:fragment="item(document)" class="junto-search-result" itemscope itemtype="http://schema.org/Article">
  <a data-pjax th:href="@{${document.permalink}}">
    <span class="junto-eyebrow" th:text="${#strings.toUpperCase(document.type)}">RESULT</span>
    <div>
      <h2 th:text="${document.title}">Result title</h2>
      <p th:text="${document.description}"></p>
    </div>
    <small>OPEN SIGNAL →</small>
  </a>
</article>
