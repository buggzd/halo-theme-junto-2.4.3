<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title = ~{::title}, _header = ~{::header}, _content = ~{::content})}"
>
  <th:block th:fragment="header"
    ><th:block
      th:replace="~{macro/page-header :: page-header(extension=${archives}, frontCover=${theme.config.patternimg.archives_patternimg}, headerTitle=~{::headerTitle}, id='archives', isRandomImage=true)}"
  /></th:block>
  <th:block th:fragment="headerTitle"
    ><h1>Full<br />Index.</h1></th:block
  >
  <th:block th:fragment="content">
    <main class="junto-archive junto-shell">
      <section
        class="junto-archive-year"
        th:each="archive : ${postFinder.archives(1, 0).items}"
        th:attr="data-year=${archive.year}"
      >
        <h2 th:text="${archive.year}">2026</h2>
        <div class="junto-archive-months">
          <div class="junto-archive-month" th:each="month : ${archive.months}">
            <span class="junto-eyebrow" th:text="|${archive.year}.${month.month}|">2026.07</span>
            <a
              class="junto-archive-entry"
              data-pjax
              th:each="post : ${month.posts}"
              th:href="@{${post.status.permalink}}"
            >
              <time th:text="${#dates.format(post.spec.publishTime, 'MM.dd')}">07.29</time
              ><strong th:text="${post.spec.title}">Post title</strong
              ><small th:text="|${post.stats.visit} VIEWS →|">0 VIEWS →</small>
            </a>
          </div>
        </div>
      </section>
    </main>
  </th:block>
</html>
