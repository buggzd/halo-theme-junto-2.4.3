<!--/* 标签页 */-->
<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title = ~{::title}, _header = ~{::header}, _content = ~{::content})}"
>
  <th:block th:fragment="title">
    <th:block th:text="${tag.spec.displayName} + '|' + ${site.title}"></th:block>
  </th:block>

  <th:block th:fragment="header">
    <div class="tag-header">
      <th:block
        th:replace="~{macro/page-header :: page-header(extension = ${tag}, frontCover = ${tag.spec.cover}, headerTitle = ~{::headerTitle})}"
      />
    </div>
  </th:block>

  <th:block th:fragment="headerTitle"><h1 th:text="${tag.spec.displayName}"></h1></th:block>

  <th:block th:fragment="content">
    <div id="primary" class="junto-route-index junto-shell" th:with="postItems=${posts.items}">
      <div class="junto-section-heading">
        <div>
          <span class="junto-eyebrow">TAG / NOTES</span>
          <h2>Tagged<br />Signals.</h2>
        </div>
        <p>汇集带有这个标签的文章、记录与实验。</p>
      </div>
      <main id="main" class="junto-post-list" role="main">
        <th:block th:if="${posts.totalPages gt 0}">
          <th:block th:each="post, postStat : ${postItems}">
            <th:block th:replace="~{macro/content :: content(${post}, ${postStat.index + 1})}" />
          </th:block>
          <div class="clearer"></div>
        </th:block>
        <th:block th:unless="${posts.totalPages gt 0}">
          <th:block th:replace="~{macro/content-none}" />
        </th:block>
      </main>
      <th:block th:replace="~{module/list-pagination :: pagination(${posts})}"></th:block>
    </div>
  </th:block>
</html>
