<!--/* Junto page hero. Keeps Sakura's fragment contract for every Halo route. */-->
<section
  class="junto-page-hero"
  th:fragment="page-header(extension, frontCover)"
  th:with="randomCoverAvailable = ${(isRandomImage == null ? #annotations.getOrDefault(extension, 'randomImage', true) : isRandomImage) and not #strings.isEmpty(theme.config.random_image.rimage_url) and (_templateId == 'post' ? theme.config.random_image.rimage_cover_open : theme.config.random_image.rimage_cover_sheet_open)}"
>
  <div class="junto-page-hero-inner junto-shell">
    <div class="junto-page-heading">
      <span class="junto-eyebrow" th:text="|${#strings.toUpperCase(_templateId)} / JUNTO ARCHIVE|"
        >PAGE / JUNTO ARCHIVE</span
      >
      <div class="junto-page-title" th:if="${headerTitle != null}"><th:block th:replace="${headerTitle}" /></div>
    </div>
    <div class="junto-page-summary">
      <p
        th:text="${#strings.isEmpty(site.subtitle) ? '作品、项目、文章与视觉实验组成的个人数字档案。' : site.subtitle}"
      ></p>
      <div class="junto-page-meta">
        <span>HALO 2.x</span><span>DEEP BLUE</span><span th:text="${#strings.toUpperCase(_templateId)}">ARCHIVE</span>
      </div>
    </div>
  </div>
  <div
    class="junto-page-orb"
    th:classappend="${not #strings.isEmpty(frontCover) or randomCoverAvailable ? ' has-cover' : ''}"
  >
    <img
      th:if="${not #strings.isEmpty(frontCover)}"
      class="lazyload"
      th:src="${#theme.assets('/images/load/orange.progress-bar-stripe-loader.svg')}"
      th:data-src="${frontCover}"
      th:data-srcset="|${thumbnail.gen(frontCover, 's')} 400w, ${thumbnail.gen(frontCover, 'm')} 800w, ${thumbnail.gen(frontCover, 'l')} 1200w, ${thumbnail.gen(frontCover, 'xl')} 1600w|"
      data-sizes="auto"
      alt="page cover"
      width="900"
      height="900"
    />
    <th:block
      th:if="${#strings.isEmpty(frontCover) and randomCoverAvailable}"
      th:with="randomImage = |${theme.config.random_image.rimage_url}?${_templateId}id=${id != null ? id : extension.metadata.name}&${theme.config.random_image.rimage_custom_param_name}=${id != null ? id : extension.metadata.name}&type=url&itype=${theme.config.random_image.rimage_cover_itype}${theme.config.random_image.rimage_cover_itype != 'image' ? '&id=' + theme.config.random_image.rimage_cover_id : ''}${#strings.isEmpty(theme.config.random_image.rimage_other_params) ? '' : '&' + theme.config.random_image.rimage_other_params}|"
    >
      <img
        class="lazyload"
        th:src="${#theme.assets('/images/load/orange.progress-bar-stripe-loader.svg')}"
        th:data-src="${randomImage}"
        alt="random page cover"
        width="900"
        height="900"
        onerror="imgError(this)"
      />
    </th:block>
  </div>
</section>
