<th:block th:fragment="content-masonry-photos">
  <div class="masonry-container junto-gallery">
    <div class="masonry-tools junto-gallery-tools">
      <th:block th:replace="~{module/photo/group :: group(${photoFinder.groupBy()})}" />
      <nav id="grid-changer" class="grid-changer" aria-label="gallery density">
        <ul>
          <li><span class="active" th:data-col="|${theme.config.photos.masonry_changer_min}|">LARGE</span></li>
          <li><span th:data-col="|${theme.config.photos.masonry_changer_max}|">DENSE</span></li>
        </ul>
      </nav>
    </div>
    <div class="photos-content fancybox-content loading">
      <div class="gallery masonry-gallery junto-gallery-grid">
        <figure
          class="gallery-item junto-art-card"
          th:each="photo, stat : ${photoFinder.listAll()}"
          th:classappend="|group-${#strings.trim(photo.spec.groupName)} col-${theme.config.photos.masonry_column}|"
        >
          <header class="gallery-icon">
            <img
              class="lazyload"
              th:src="${#strings.isEmpty(photo.spec.cover) ? #theme.assets('/images/load/load.gif') : photo.spec.cover}"
              th:alt="${photo.spec.displayName}"
              th:data-src="${photo.spec.url}"
              height="700"
              width="700"
            />
          </header>
          <figcaption>
            <span
              class="junto-eyebrow"
              th:text="|${stat.index + 1 &lt; 10 ? '0' + (stat.index + 1) : stat.index + 1} / VISUAL ARCHIVE|"
              >01 / VISUAL ARCHIVE</span
            >
            <h3 th:text="${photo.spec.displayName}">Untitled</h3>
            <p th:if="${not #strings.isEmpty(photo.spec.description)}" th:text="${photo.spec.description}"></p>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</th:block>
