<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title=~{::title}, _header=~{::header}, _content=~{::content})}"
>
  <th:block th:fragment="title"><th:block th:text="${title} + '|' + ${site.title}" /></th:block>
  <th:block th:fragment="header"
    ><th:block
      th:replace="~{macro/page-header :: page-header(extension=${photos}, frontCover=${theme.config.patternimg.photos_patternimg}, headerTitle=~{::headerTitle}, id='photos', isRandomImage=true)}"
  /></th:block>
  <th:block th:fragment="headerTitle"
    ><h1>Unfixed<br />Gallery.</h1></th:block
  >
  <th:block th:fragment="content"
    ><section class="junto-gallery-shell">
      <div class="junto-gallery-intro junto-shell">
        <div>
          <span class="junto-eyebrow">WORKS / VISUAL ARCHIVE</span>
          <h2>Loose<br />Frames.</h2>
        </div>
        <p th:text="${theme.config.photos.intro_text ?: '散落的色彩与片刻，在这里重新组成一段持续生长的视觉叙事。'}">
          散落的色彩与片刻，在这里重新组成一段持续生长的视觉叙事。
        </p>
      </div>
      <th:block
        th:if="${theme.config.photos.artwork_source == 'pixiv' and not #strings.isEmpty(theme.config.photos.pixiv_feed_url)}"
        th:insert="~{macro/content-pixiv-photos}"
      />
      <th:block
        th:unless="${theme.config.photos.artwork_source == 'pixiv' and not #strings.isEmpty(theme.config.photos.pixiv_feed_url)}"
        th:insert="~{macro/content-masonry-photos}"
      /></section
  ></th:block>
</html>
