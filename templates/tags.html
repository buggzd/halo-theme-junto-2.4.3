<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title=~{::title}, _header=~{::header}, _content=~{::content})}"
>
  <th:block th:fragment="header"
    ><th:block
      th:replace="~{macro/page-header :: page-header(extension=${tags}, frontCover=${theme.config.patternimg.tag_patternimg}, headerTitle=~{::headerTitle}, id='tags')}"
  /></th:block>
  <th:block th:fragment="headerTitle"
    ><h1>Signal<br />Cloud.</h1></th:block
  >
  <th:block th:fragment="content">
    <main class="junto-tags junto-shell">
      <div class="junto-section-heading">
        <div>
          <span class="junto-eyebrow">TAG / SIGNALS</span>
          <h2>Loose<br />Keywords.</h2>
        </div>
        <p>标签像散落在工作室墙上的便签。字号随文章数量变化，但每一个入口都同样可达。</p>
      </div>
      <div class="junto-tag-field">
        <a
          data-pjax
          th:each="tag : ${tags}"
          th:href="@{${tag.status.permalink}}"
          th:style="|--tag-weight: ${tag.postCount}; --tag-color: ${tag.spec.color}|"
          ><span th:text="${tag.spec.displayName}">Tag</span><small th:text="${tag.postCount}">0</small></a
        >
      </div>
    </main>
  </th:block>
</html>
