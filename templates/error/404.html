<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title=~{::title}, _header=~{::header}, _content=~{::content})}"
>
  <th:block th:fragment="title"><th:block th:text="|Signal lost · ${site.title}|" /></th:block>
  <th:block th:fragment="content">
    <main class="junto-error">
      <div>
        <div class="junto-error-code" data-text="404">404</div>
        <span class="junto-eyebrow">ERROR / COORDINATES UNKNOWN</span>
        <h1>Signal lost.</h1>
        <p>这个地址没有留下任何档案。它可能被移动、删除，或者从未存在。</p>
        <div class="junto-error-actions">
          <a data-pjax th:href="@{/}">RETURN HOME</a><a href="javascript:history.go(-1)">GO BACK</a
          ><a th:if="${pluginFinder.available('PluginSearchWidget', '>=1.5.0')}" th:href="@{/search}">SEARCH</a>
        </div>
      </div>
    </main>
  </th:block>
</html>
