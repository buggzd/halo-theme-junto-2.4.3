<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: layout(_title=~{::title}, _header=~{::header}, _content=~{::content})}"
>
  <th:block th:fragment="header"
    ><th:block
      th:replace="~{macro/page-header :: page-header(extension=${categories}, frontCover=${theme.config.patternimg.category_patternimg}, headerTitle=~{::headerTitle}, id='categories')}"
  /></th:block>
  <th:block th:fragment="headerTitle"
    ><h1>Topic<br />Atlas.</h1></th:block
  >
  <th:block th:fragment="content">
    <main class="junto-taxonomy junto-shell">
      <div class="junto-section-heading">
        <div>
          <span class="junto-eyebrow">CATEGORY / ROUTES</span>
          <h2>Choose a<br />Direction.</h2>
        </div>
        <p>按主题进入文章档案。数量不是排名，而是每条创作路径留下的轨迹。</p>
      </div>
      <div class="junto-taxonomy-grid">
        <a
          class="junto-taxonomy-card"
          data-pjax
          th:each="category, stat : ${categories}"
          th:href="@{${category.status.permalink}}"
        >
          <span
            class="junto-eyebrow"
            th:text="|${stat.index + 1 &lt; 10 ? '0' + (stat.index + 1) : stat.index + 1} / CATEGORY|"
            >01 / CATEGORY</span
          >
          <h2 th:text="${category.spec.displayName}">Category</h2>
          <div>
            <p
              th:text="${#strings.isEmpty(category.spec.description) ? '浏览这一方向下的全部文章。' : category.spec.description}"
            ></p>
            <small th:text="|${category.postCount} POSTS →|">0 POSTS →</small>
          </div>
        </a>
      </div>
    </main>
  </th:block>
</html>
