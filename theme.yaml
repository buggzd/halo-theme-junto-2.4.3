apiVersion: theme.halo.run/v1alpha1
kind: Theme
spec:
  customTemplates:
    page:
      - name: 友情链接
        description: 支持可预设文本的友链
        screenshot: 
        file: page_links.html
  displayName: Junto Blue Archive
  author:
    name: buggzd
    website: https://github.com/buggzd
  description: 面向 Halo 2.x 的深蓝编辑风个人创作档案主题
  logo: /themes/theme-junto/assets/images/default/avatar.webp
  website: https://github.com/buggzd/halo-theme-junto-2.4.3
  repo: https://github.com/buggzd/halo-theme-junto-2.4.3.git
  settingName: theme-junto-setting
  configMapName: theme-junto-configMap
  # 通过 vite 环境变量 (VITE_THEME_VERSION) 配置，这里不需要配置。
  version: 2.4.3
  require: ">=2.19.0"
metadata:
  name: theme-junto
